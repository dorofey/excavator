[package]
name = "excavator"
version = "0.3.0"
edition = "2024"
publish = false
default-run = "excavator"

[dependencies]
gpui-kit = { version = "=0.7.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
trash = "=5.2.9"

security-framework = "=3.7.0"
url = "=2.5.8"
ssh2 = "=0.9.6"
suppaftp = { version = "=12.1.1", features = ["native-tls", "no-log"] }
rust-s3 = { version = "=0.37.2", default-features = false, features = ["sync-native-tls", "fail-on-err"] }
quick-xml = "=0.38.4"
chrono = "=0.4.45"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
libc = "=0.2.189"
plist = "=1.10.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"], optional = true }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"], optional = true }
signal-hook = { version = "=0.3.18", optional = true }

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]
tui = ["dep:ratatui", "dep:crossterm", "dep:signal-hook"]

[[bin]]
name = "excavator"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "excavator-tui"
path = "src/bin/excavator-tui.rs"
required-features = ["tui"]

[[example]]
name = "verify_appearance_ui"
required-features = ["gui"]

[[example]]
name = "verify_remote_ui"
required-features = ["gui"]

[[example]]
name = "verify_splits_ui"
required-features = ["gui"]

[[example]]
name = "verify_terminal_ui"
required-features = ["gui"]

[[example]]
name = "verify_appearance"
required-features = ["gui"]
