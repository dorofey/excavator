[package]
name = "excavator"
version = "0.2.3"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
trash = "=5.2.9"

security-framework = "=3.7.0"
url = "=2.5.8"
ssh2 = "=0.9.6"
suppaftp = { version = "=12.1.1", features = ["native-tls", "no-log"] }
rust-s3 = { version = "=0.37.2", default-features = false, features = ["sync-native-tls", "fail-on-err"] }
quick-xml = "=0.38.4"
chrono = "=0.4.45"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
libc = "=0.2.189"
plist = "=1.10.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
